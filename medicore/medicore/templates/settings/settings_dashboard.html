{% extends 'base.html' %}

{% block title %}MediCore | Settings{% endblock %}
{% block header_title %}System Settings{% endblock %}

{% block content %}
<div class="rounded-2xl bg-white border border-slate-200 p-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
    <h3 class="text-lg font-semibold text-slate-900">System Configuration</h3>
    <div class="flex flex-wrap items-center gap-3">
      <a href="{{ url_for('settings.tax_departments_dashboard') }}" class="text-sm font-semibold text-slate-700">Taxes & Departments</a>
      <a href="{{ url_for('settings.audit_log_view') }}" class="text-sm font-semibold text-med-700">View Audit Logs</a>
    </div>
  </div>

  <form method="post" action="{{ url_for('settings.settings_update') }}" class="space-y-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <div class="border-b border-slate-200 pb-4">
      <h4 class="text-sm font-semibold text-slate-700">General</h4>
      <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium text-slate-700">Clinic Name</label>
          <input name="clinic_name" value="{{ settings.get('clinic_name','') }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700">Contact Details</label>
          <input name="clinic_contact" value="{{ settings.get('clinic_contact','') }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
        <div class="md:col-span-2">
          <label class="text-sm font-medium text-slate-700">Clinic Address</label>
          <input name="clinic_address" value="{{ settings.get('clinic_address','') }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
      </div>
    </div>

    <div class="border-b border-slate-200 pb-4">
      <h4 class="text-sm font-semibold text-slate-700">Financial</h4>
      <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium text-slate-700">VAT %</label>
          <input name="vat_percentage" value="{{ settings.get('vat_percentage','') }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700">SSCL %</label>
          <input name="sscl_percentage" value="{{ settings.get('sscl_percentage','') }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
        <div class="md:col-span-2">
          <label class="text-sm font-medium text-slate-700">Default Invoice Notes</label>
          <textarea name="invoice_notes" rows="3" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">{{ settings.get('invoice_notes','') }}</textarea>
        </div>
      </div>
    </div>

    <div>
      <h4 class="text-sm font-semibold text-slate-700">Integrations</h4>
      <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="flex items-center gap-2 text-sm text-slate-700">
          <input type="checkbox" name="sms_gateway_active" {% if settings.get('sms_gateway_active') == 'true' %}checked{% endif %} />
          SMS Gateway Active
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-700">
          <input type="checkbox" name="whatsapp_gateway_active" {% if settings.get('whatsapp_gateway_active') == 'true' %}checked{% endif %} />
          WhatsApp Gateway Active
        </label>
      </div>
    </div>

    <div class="flex justify-end">
      <button type="submit" class="rounded-lg bg-med-600 text-white px-5 py-2 text-sm hover:bg-med-700">Save Settings</button>
    </div>
  </form>
</div>
{% endblock %}
