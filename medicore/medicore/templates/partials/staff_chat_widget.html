<div id="staff-chat" class="fixed bottom-6 right-6 w-80 bg-white border border-slate-200 rounded-2xl shadow-xl">
  <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
    <h4 class="text-sm font-semibold text-slate-900">Staff Chat</h4>
    <button type="button" id="chat-toggle" class="text-xs text-slate-500">Hide</button>
  </div>
  <div id="chat-body" class="p-4 space-y-2 h-48 overflow-y-auto text-sm"></div>
  <div class="px-4 py-3 border-t border-slate-200">
    <input id="chat-input" type="text" placeholder="Type urgent message..." class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io('/internal_staff_chat');
  const chatBody = document.getElementById('chat-body');
  const chatInput = document.getElementById('chat-input');
  const chatToggle = document.getElementById('chat-toggle');
  const chatWidget = document.getElementById('staff-chat');

  chatToggle.addEventListener('click', () => {
    chatBody.classList.toggle('hidden');
    chatInput.classList.toggle('hidden');
    chatToggle.textContent = chatBody.classList.contains('hidden') ? 'Show' : 'Hide';
  });

  socket.on('urgent_message', (payload) => {
    const message = document.createElement('div');
    message.className = 'rounded-lg bg-rose-50 border border-rose-200 px-3 py-2';
    message.textContent = `${payload.sender}: ${payload.message}`;
    chatBody.prepend(message);
  });

  chatInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      const text = chatInput.value.trim();
      if (text) {
        socket.emit('urgent_message', { message: text });
        chatInput.value = '';
      }
    }
  });
</script>
