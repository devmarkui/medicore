<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore | Verify 2FA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
<div class="min-h-full flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md rounded-2xl bg-white shadow-xl border border-slate-200 p-8">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-teal-700">Two-Factor Verification</h1>
      <p class="text-sm text-slate-500 mt-1">Enter the 6-digit code from your authenticator app.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for category, message in messages %}
            <div class="rounded-lg px-3 py-2 text-sm {% if category == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('auth.verify_2fa') }}" class="space-y-4" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="context" value="login" />
      <div>
        <label for="token" class="block text-sm font-medium text-slate-700 mb-1">Authenticator Code</label>
        <input id="token" name="token" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
               placeholder="123456" />
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-teal-600 text-white py-2.5 font-medium hover:bg-teal-700 transition">
        Verify &amp; Continue
      </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">Lost access? Contact a system administrator.</p>
  </div>
</div>
</body>
</html>
