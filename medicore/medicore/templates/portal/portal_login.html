<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore Patient Portal | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-800 antialiased">
<div class="min-h-full flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-2xl bg-white border border-slate-200 p-6">
    <h1 class="text-xl font-semibold text-slate-900">Patient Portal Login</h1>
    <p class="text-sm text-slate-500 mt-1">Access your appointments and medical records.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mt-4 space-y-2">
          {% for category, message in messages %}
            <div class="rounded-lg px-4 py-3 text-sm {% if category == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('portal.portal_login_submit') }}" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div>
        <label class="text-xs font-semibold text-slate-500">NIC or Email</label>
        <input type="text" name="identifier" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500">Password</label>
        <input type="password" name="password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>
